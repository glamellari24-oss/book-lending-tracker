<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Lending Tracker</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><header class="header"><div class="container"><p class="eyebrow">YOUR PERSONAL LIBRARY</p><h1>Book Lending Tracker</h1><p>Keep track of your books, borrowers and due dates.</p></div></header>
<main class="container"><section class="card" aria-labelledby="add-heading"><h2 id="add-heading">Lend a book</h2><form id="loan-form" novalidate><div class="grid">
<div class="field"><label for="title">Title *</label><input id="title" name="title" required maxlength="150" aria-describedby="title-error"><span class="error" id="title-error"></span></div>
<div class="field"><label for="author">Author *</label><input id="author" name="author" required maxlength="100" aria-describedby="author-error"><span class="error" id="author-error"></span></div>
<div class="field"><label for="borrower">Borrower *</label><input id="borrower" name="borrower" required maxlength="100" aria-describedby="borrower-error"><span class="error" id="borrower-error"></span></div>
<div class="field"><label for="due">Due date *</label><input id="due" name="due" type="date" required aria-describedby="due-error"><span class="error" id="due-error"></span></div>
<div class="field"><label for="genre">Genre *</label><select id="genre" name="genre" required aria-describedby="genre-error"><option value="">Select a genre</option><option>Fiction</option><option>Science</option><option>History</option><option>Technology</option></select><span class="error" id="genre-error"></span></div></div><button class="button" type="submit">+ Add loan</button><p id="message" role="status" class="message"></p></form></section>
<section class="card" aria-labelledby="loans-heading"><div class="section-heading"><h2 id="loans-heading">Your loans</h2><div class="summary" aria-live="polite"><span>Total loans: <strong id="total">0</strong></span><span>Overdue loans: <strong id="overdue">0</strong></span></div></div><div class="table-wrap"><table><caption class="sr-only">Books lent to borrowers</caption><thead><tr><th scope="col">Title</th><th scope="col">Author</th><th scope="col">Borrower</th><th scope="col">Due date</th><th scope="col">Genre</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody id="loans"></tbody></table></div></section></main><footer class="container footer">Book Lending Tracker · Group B</footer></body></html>
